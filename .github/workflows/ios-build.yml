# Whatd I Make iOS — Phase 3: SIGNED archive + TestFlight upload.
#
# What changed from Phase 1: the unsigned compile proof is now a real
# signed build. The workflow:
#   1. installs JS deps, syncs Capacitor, installs pods
#   2. lays down the App Store Connect API key, the Apple Distribution
#      certificate (into a throwaway keychain) and the provisioning
#      profile — all from GitHub Secrets, never from repo files
#   3. archives with manual signing (Apple Distribution + the
#      "Whatd I Make App Store" profile)
#   4. exports with destination=upload, which sends the build straight
#      to App Store Connect / TestFlight using the API key
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_API_KEY_ID          e.g. Q5XMJ3BWLZ
#   APPSTORE_API_ISSUER_ID       the Issuer ID UUID from App Store Connect
#   APPSTORE_API_KEY_P8_BASE64   base64 of the AuthKey .p8 file
#   BUILD_CERTIFICATE_BASE64     base64 of the distribution .p12
#   P12_PASSWORD                 password of that .p12
#   PROVISIONING_PROFILE_BASE64  base64 of the .mobileprovision file

name: iOS build (Phase 3 — signed, TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    name: Archive signed + upload to TestFlight
    # macos-26 = Xcode 26 / iOS 26 SDK. Apple rejects uploads built
    # with anything older (validation error seen 2026-11-12 on
    # macos-15's iOS 18.5 SDK). Do not downgrade this runner.
    runs-on: macos-26
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web assets + iOS project (Capacitor)
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Lay down the App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Create keychain and import the distribution certificate
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install the provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/WhatdIMake.mobileprovision"

      - name: Archive SIGNED (Apple Distribution)
        # Signing settings live in the App target's Release config in
        # project.pbxproj (Manual + Apple Distribution + the
        # "Whatd I Make App Store" profile). They must NOT be passed on
        # the command line: global overrides also hit the CocoaPods
        # targets, which reject provisioning profiles outright
        # ("Capacitor does not support provisioning profiles", exit 65).
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/WhatdIMake.xcarchive" \
            archive

      - name: Export + upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WhatdIMake.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload the archive as an artifact (kept either way)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhatdIMake-signed-xcarchive
          path: ${{ runner.temp }}/WhatdIMake.xcarchive
          if-no-files-found: warn
