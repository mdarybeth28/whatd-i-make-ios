# What'd I Make? iOS — Phase 1 compile proof.
#
# What this does TODAY (Phase 1, $0): builds the app on a macOS
# runner WITHOUT code signing and uploads the unsigned archive as a
# build artifact. That proves the code compiles and the project
# assembles — everything that can be proven before a paid Apple
# Developer account exists.
#
# Where this file lives: in the repo it must sit at
#   .github/workflows/ios-build.yml
# with the Capacitor project at the repo root (this folder's
# contents become the repo root — see phase1/README.md).
#
# ------------------------------------------------------------------
# PHASE 3 TODO (do NOT enable before Mary's $99 enrollment):
#   1. Signing secrets in the repo's GitHub Secrets:
#        APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID,
#        APPSTORE_API_KEY_P8_BASE64  (the App Store Connect .p8 key)
#        BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
#        PROVISIONING_PROFILE_BASE64
#      (Names above are the plan; follow the Phase 3 setup sheet when
#      it exists — never paste key material into this file itself.)
#   2. Replace CODE_SIGNING_ALLOWED=NO below with a signed archive
#      step (xcodebuild -allowProvisioningUpdates with the API key,
#      or fastlane gym), then export an .ipa with an ExportOptions
#      plist (method: app-store).
#   3. Add the TestFlight upload step (fastlane pilot, or
#      xcrun altool / Transporter with the same API key).
# Nothing below the "archive" step is Phase 3 — the artifact upload
# stays either way.
# ------------------------------------------------------------------

name: iOS build (unsigned compile proof)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    name: Archive (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web assets + iOS project (Capacitor)
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Archive WITHOUT code signing (Phase 1 proof)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/WhatdIMake.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload the unsigned archive as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatdIMake-unsigned-xcarchive
          path: ${{ runner.temp }}/WhatdIMake.xcarchive
          if-no-files-found: error
